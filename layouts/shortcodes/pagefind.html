<div id="search"></div>

<script src="{{ "_pagefind/pagefind-ui.js" | relURL }}"></script>

    new PagefindUI({
      element: "#search",
      showSubResults: true,
      bundlePath: "{{ "_pagefind/" | relURL }}"
    });
  });
</script>
